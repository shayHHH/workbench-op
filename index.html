<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bitvast 交易执行、客户准入、地址校验、收付款复核与凭证归档工作台" />
    <title>Bitvast Workbench · 交易运营系统</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23231c17'/%3E%3Ctext x='31' y='43' text-anchor='middle' font-family='Arial,sans-serif' font-size='39' font-weight='800' fill='%23ff7a00'%3EB%3C/text%3E%3Cpath d='M13 18h14M11 24h14M10 30h14M12 36h14M15 42h12' stroke='%23ff7a00' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div id="app" class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span><strong>Bitvast</strong><small>Trade Workbench</small></span>
        </div>
        <div class="workspace-label">业务工作台</div>
        <nav id="primary-nav" class="primary-nav"></nav>
        <div class="sidebar-bottom">
          <button class="demo-reset" id="reset-demo" type="button">
            <span aria-hidden="true">↻</span>
            重置演示数据
          </button>
          <div class="demo-note"><span></span>演示环境 · 本地数据<br />不包含真实客户信息</div>
        </div>
      </aside>

      <div class="app-main">
        <header class="topbar">
          <button class="icon-button menu-button" id="menu-button" aria-label="打开导航" type="button">☰</button>
          <div class="top-search">
            <span aria-hidden="true">⌕</span>
            <input id="global-search" type="search" placeholder="搜索客户、案件编号或交易编号" aria-label="全局搜索" />
            <kbd>⌘ K</kbd>
          </div>
          <div class="top-actions">
            <button class="icon-button notification-button" type="button" aria-label="通知">
              <span aria-hidden="true">♧</span><b id="notification-count">4</b>
            </button>
            <label class="role-switcher">
              <span>演示视角</span>
              <select id="role-select" aria-label="切换演示角色"></select>
            </label>
            <button class="user-menu" type="button" aria-label="当前用户">
              <span id="user-avatar">YL</span>
              <span><strong id="user-name">杨澜</strong><small id="user-title">Junior Trader · JT-018</small></span>
              <i aria-hidden="true">⌄</i>
            </button>
          </div>
        </header>

        <main id="main-content" tabindex="-1"></main>
      </div>
    </div>

    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
    <aside id="detail-drawer" class="detail-drawer" aria-label="客户详情" aria-hidden="true"></aside>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="confirm-root"></div>
    <div id="pdf-modal-root"></div>
    <div id="customer-modal-root"></div>
    <div id="material-order-modal-root"></div>

    <script src="assets/pdf-lib.min.js"></script>
    <script src="assets/pdf-template-01.js"></script>
    <script src="assets/pdf-template-02.js"></script>
    <script src="assets/pdf-template-03.js"></script>
    <script src="assets/pdf-template-04.js"></script>
    <script src="assets/pdf-template-05.js"></script>
    <script src="assets/pdf-template-06.js"></script>
    <script src="assets/pdf-template-07.js"></script>
    <script src="assets/pdf-template-08.js"></script>
    <script src="assets/pdf-template-09.js"></script>
    <script src="assets/pdf-template-10.js"></script>
    <script src="assets/pdf-template-11.js"></script>
    <script src="assets/pdf-template-12.js"></script>
    <script src="app.js"></script>
  </body>
</html>
